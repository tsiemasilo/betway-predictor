[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/fixtures"
  to = "/.netlify/functions/fixtures"
  status = 200

[[redirects]]
  from = "/api/fixtures/:id/prediction"
  to = "/.netlify/functions/prediction?id=:id"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
